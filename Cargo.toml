[package]
name = "nasvar"
version = "1.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
indexmap = "2.0"
noodles = { version = "0.104", features = ["bam", "sam", "fasta", "bgzf", "core", "csi"] }
bitvec = "1"
tikv-jemallocator = { version = "0.6", optional = true }
schemars = "1"
jsonschema = { version = "0.28", default-features = false }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["flate2", "deflate-flate2", "time"] }
time = "0.3"

[features]
default = ["jemalloc", "cram"]
jemalloc = ["dep:tikv-jemallocator"]
cram = ["noodles/cram"]

# CRAM processing is *exceptionally* slow because of architectural limitations (of the CRAM format) and implementation limtiations (in noodles)
# we are working to patch it but for now we use the noodle main branch - beware it will be SLOW
#[patch.crates-io]
#noodles-cram = { path = "../ramtools/noodles-cram-patch" }

[[bin]]
name = "nasvar"
path = "src/bin/nasvar.rs"

[[bin]]
name = "aggregate"
path = "src/bin/aggregate.rs"
